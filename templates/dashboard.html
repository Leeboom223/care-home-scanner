<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Guardian | CHIBUZOR NNOLI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; }
        .card { background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 12px; }
        .btn-scan { background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%); border: none; font-weight: bold; transition: 0.3s; }
        .btn-scan:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        .status-header { border-left: 5px solid #3b82f6; padding-left: 15px; }
        .risk-high { border-left: 5px solid #f59e0b !important; }
        .risk-critical { border-left: 5px solid #ef4444 !important; }
        .risk-secure { border-left: 5px solid #10b981 !important; }
        pre { background: #000; padding: 15px; border-radius: 8px; color: #10b981; font-size: 0.9rem; }
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h1 class="fw-bold text-white mb-0">🛡️ IoT GUARDIAN <span class="fs-6 text-primary pulse">● SYSTEM LIVE</span></h1>
            <p class="text-muted small">Lead Researcher: CHIBUZOR NNOLI | MSc Cyber Security</p>
        </div>
        <a href="/run-scan" class="btn btn-scan btn-lg px-4 py-2" id="scanBtn" onclick="startScan()">
            🚀 RUN NETWORK AUDIT
        </a>
    </div>

    <div class="row mb-4">
        <div class="col-12">
            <div class="card shadow-lg">
                <div class="card-header bg-dark text-primary fw-bold border-bottom border-primary">
                    📊 EXECUTIVE THREAT SUMMARY
                </div>
                <div class="card-body">
                    <pre class="m-0">{{ summary }}</pre>
                </div>
            </div>
        </div>
    </div>

    <h3 class="mb-4 text-info fw-bold">🔍 DETAILED NODE ANALYSIS</h3>
    <div class="row">
        {% for node in details %}
        <div class="col-md-6 mb-4">
            <div class="card h-100 shadow 
                {% if 'CRITICAL' in node %}risk-critical{% elif 'HIGH' in node %}risk-high{% else %}risk-secure{% endif %}">
                <div class="card-body">
                    <pre class="m-0">{{ node }}</pre>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    function startScan() {
        const btn = document.getElementById('scanBtn');
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> ANALYZING SUBDOMAIN...';
        btn.classList.add('disabled');
    }
</script>

</body>
</html>
